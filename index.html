<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
</head>
<body>
<div class="heading"><h1>CALCULATOR</h1></div>

<div class="container">
    <input class="display" type="text" placeholder="0" readonly>

    <div class="keys">
    <button id="7">7</button><button id="8">8</button ><button id="9">9</button><button id="divide">/</button>
    <button id="4">4</button><button id="5">5</button><button id="6">6</button><button id="multiply">*</button>
    <button id="1">1</button><button id="2">2</button><button id="3">3</button><button id="subtract">-</button>
    <button id="0">0</button><button id="dot">.</button><button id="equals">=</button><button id="add">+</button>
    <button id="clear">C</button>
    </div>
</div>
<script src="index.js"></script>
</body>
